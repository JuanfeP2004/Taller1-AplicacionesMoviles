<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE FIGMA STORE</title>
    <link rel="stylesheet" href="../Maquetacion/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="left-buttons">
                <button>Shop</button>
                <button>About</button>
            </div>
            <h1>THE FIGMA STORE</h1>
            <div class="right-buttons">
                <button>👤</button>
                <button>Cart</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <img src="../Maquetacion/img/FondoInicio.jpg" alt="Hero Image" class="hero-image">
        </section>

        <section class="tagline">
            <h2>Figma's Collection Of Layers And Components For You And Your Friends</h2>
        </section>

        <section class="product-gallery">
            <!-- Repite este bloque 40 veces para crear una galería 4x10 -->
            <div class="product-item">
                <img src="/placeholder.svg?height=300&width=300" alt="Product Image">
                <div class="product-info">
                    <span class="product-name">Nombre del Producto</span>
                    <span class="product-price">$XX.XX</span>
                </div>
            </div>
            <!-- ... (repite 39 veces más) ... -->
        </section>
    </main>

    <footer>
        <p>&copy; 2023 THE FIGMA STORE. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
