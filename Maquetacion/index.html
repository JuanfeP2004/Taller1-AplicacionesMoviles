<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE FIGMA STORE</title>
    <link rel="stylesheet" href="../Maquetacion/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="left-buttons">
                <button>SHOP</button>
                <button>ABOUT</button>
            </div>
            <h1>THE FIGMA STORE</h1>
            <div class="right-buttons">
                <button>👤</button>
                <button>CART</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <img src="../Maquetacion/img/FondoInicio.png" alt="Hero Image" class="hero-image">
        </section>

        <section class="tagline">
            <h2>Figma's Collection Of Layers And Components For You And Your Friends</h2>
        </section>

        <section class="product-gallery">
            <!-- Bloque de galería 4x10 (img productos)-->
            <div class="product-item">
                <img src="../Maquetacion/img/img1.jpg" alt="Product Image">
                <div class="product-info">
                    <span class="product-name">Zapatos 1</span>
                    <span class="product-price">$250.000</span>
                </div>
            </div>
            <div class="product-item">
              <img src="../Maquetacion/img/img2.jpg" alt="Product Image">
              <div class="product-info">
                  <span class="product-name">Zapatos 2</span>
                  <span class="product-price">$250.000</span>
              </div>
            </div>
            <div class="product-item">
              <img src="../Maquetacion/img/img3.jpg" alt="Product Image">
              <div class="product-info">
                  <span class="product-name">Zapatos 3</span>
                  <span class="product-price">$250.000</span>
              </div>
            </div>
            <div class="product-item">
              <img src="../Maquetacion/img/img4.jpg" alt="Product Image">
              <div class="product-info">
                  <span class="product-name">Zapatos 4</span>
                  <span class="product-price">$250.000</span>
              </div>
            </div>
            <div class="product-item">
              <img src="../Maquetacion/img/img5.jpg" alt="Product Image">
              <div class="product-info">
                  <span class="product-name">Zapatos 5</span>
                  <span class="product-price">$250.000</span>
              </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 THE FIGMA STORE. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
